# ⚠️ CRITICAL: DO NOT CHANGE THESE VERSIONS
# This project requires specific versions due to compatibility constraints
# Changing versions may break the build or cause runtime errors
[toolchain]
anchor_version = "0.26.0"  # DO NOT CHANGE - Required for compatibility

[features]
resolution = true
skip-lint = false

[programs.devnet]
fractional_vault = "DKkV5YimB3gjBLhtLMGRzkv5PeR4FZ9PXjMLHwd9umdr"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/fractional_vault"]

[test]
startup_wait = 10000
shutdown_wait = 10000
upgradeable = false

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

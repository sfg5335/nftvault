[toolchain]
anchor_version = "0.26.0"

[features]
resolution = true
skip-lint = false

[programs.devnet]
fractional_vault = "3L2zzE1UV6oo2xkLpCMXPGB8zeZfYA3ygjYWXKhAJsRv"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/fractional_vault"]

[test]
startup_wait = 10000
shutdown_wait = 10000
upgradeable = false

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/**/*.ts"

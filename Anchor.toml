[toolchain]
anchor_version = "0.31.1"
solana_version = "2.1.0"
package_manager = "npm"

[features]
resolution = true
skip-lint = false

[programs.devnet]
fractional_vault = "87JJ2Ttnei2xU2S9UeYYj8pNuug1ezcbkwC3TaxzTCCC"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[workspace]
members = ["programs/fractional_vault"]

[test]
startup_wait = 10000
shutdown_wait = 10000
upgradeable = false
